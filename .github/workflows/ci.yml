name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: engine (rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.83"
          components: clippy, rustfmt
          # The browser build target. Adding it here means a change that breaks
          # the WebAssembly build fails CI rather than the deploy.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: fmt
        working-directory: engine
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: engine
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        working-directory: engine
        run: cargo test --release
      - name: wasm builds
        working-directory: engine
        run: cargo build --release --lib --target wasm32-unknown-unknown

  web:
    name: web (react)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.83"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The prerender step shells out to the native binaries to build the daily
      # archive, so both targets are needed for a full build.
      - name: build engine (native)
        working-directory: engine
        run: cargo build --release --bins
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run build
      - working-directory: web
        run: npm test --if-present
      - name: check the build produced what the site needs
        working-directory: web
        run: node scripts/verify-build.mjs
